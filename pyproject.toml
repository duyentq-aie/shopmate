[project]
name = "shopmate"
version = "0.1.0"
description = "AI sales assistant for a Vietnamese online shop, running next to Saleor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "graphql-core>=3.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "qdrant-client>=1.19.1,<1.20",
    "torch>=2.14,<2.15",
    "transformers>=5.19,<6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Not an installable package: entry points run from the repo root as modules,
# e.g. `uv run python -m scripts.generate_catalog`.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `uv run pytest` = fast unit tests, no services. `uv run pytest -m integration` = needs the
# running Qdrant and the cached bge-m3 model. scripts/test_all.sh runs both.
addopts = "-m 'not integration and not live_llm'"
markers = [
    "integration: needs the running Qdrant (docker compose) and the cached bge-m3 model",
    "live_llm: calls the real Gemini API (free tier, counts against the daily quota); never part of scripts/test_all.sh",
]

# torch comes from PyTorch's CPU-only index (no CUDA wheels, ~200 MB instead of GBs).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
