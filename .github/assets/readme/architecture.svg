  <!-- ============ legend ============ -->
  <rect x="24" y="822" width="1352" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="44" y="849" class="nm" style="font-size:16px">Arrows</text>
  <path d="M120 843 H170" class="req" marker-start="url(#aReq)" marker-end="url(#aReq)"/>
  <text x="182" y="849" class="sb">request / response</text>
  <path d="M352 843 H402" class="llm" marker-end="url(#aLlm)"/>
  <text x="414" y="849" class="sb">LLM call</text>
