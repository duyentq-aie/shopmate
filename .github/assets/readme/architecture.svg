  <rect x="1138" y="146" width="218" height="104" rx="12" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/>
  <ellipse cx="1161" cy="164" rx="11" ry="4" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M1150 164 V186 A11 4 0 0 0 1172 186 V164 M1150 175 A11 4 0 0 0 1172 175" fill="none" stroke="#C2410C" stroke-width="2"/>
  <text x="1184" y="170" class="on">Qdrant</text>
  <text x="1184" y="191" class="os">shopmate_vn_v2</text>
  <text x="1184" y="212" class="os">dense_folded, bge-m3</text>
  <text x="1184" y="233" class="os">indexed offline</text>

  <rect x="1138" y="262" width="218" height="104" rx="12" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/>
  <rect x="1150" y="274" width="22" height="22" rx="5" fill="none" stroke="#C2410C" stroke-width="2"/>
  <rect x="1156" y="280" width="10" height="10" rx="2" fill="#C2410C"/>
  <path d="M1156 270 V274 M1166 270 V274 M1156 296 V300 M1166 296 V300" stroke="#C2410C" stroke-width="2"/>
  <text x="1184" y="287" class="on">Gemini Flash-Lite</text>
  <text x="1184" y="308" class="os">gemini-3.5-flash-lite</text>
  <text x="1184" y="329" class="os">free tier, 450 a day</text>
  <text x="1184" y="350" class="os">cached on disk</text>

  <rect x="1138" y="410" width="218" height="98" rx="12" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/>
  <rect x="1150" y="426" width="22" height="18" rx="3" fill="none" stroke="#C2410C" stroke-width="2"/>
  <path d="M1155 426 V422 A6 6 0 0 1 1167 422 V426" fill="none" stroke="#C2410C" stroke-width="2"/>
  <text x="1184" y="433" class="on">Saleor, read-only</text>
  <text x="1184" y="453" class="os">runtime token</text>
  <text x="1184" y="473" class="os">allowlisted queries</text>
  <text x="1184" y="493" class="os">seeded from data/seed</text>

  <!-- ============ OBSERVABILITY ============ -->
  <rect x="24" y="530" width="1352" height="92" rx="18" fill="#E3F4F1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="44" y="556" class="bnd" style="fill:#0F766E">OBSERVABILITY</text>
  <text x="44" y="580" class="ts">One JSON line per request, errors included;</text>
  <text x="44" y="602" class="ts">customer text is masked before it is written.</text>

  <path d="M540 504 V548" class="trc" marker-end="url(#aTrc)"/>
  <rect x="440" y="548" width="200" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="454" y="572" class="tn">Tracing</text><text x="454" y="594" class="ts">span per step, masked</text>
  <rect x="680" y="548" width="200" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="694" y="572" class="tn">logs/traces.jsonl</text><text x="694" y="594" class="ts">one line per request</text>
  <rect x="920" y="548" width="200" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="934" y="572" class="tn">Monitor · :8765</text><text x="934" y="594" class="ts">loopback, read-only</text>
  <rect x="1160" y="548" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1174" y="572" class="tn">Dashboard</text><text x="1174" y="594" class="ts">request journey, flow</text>
  <path d="M640 577 H680" class="trc" marker-end="url(#aTrc)"/>
  <path d="M880 577 H920" class="trc" marker-end="url(#aTrc)"/>
  <path d="M1120 577 H1160" class="trc" marker-end="url(#aTrc)"/>

  <!-- ============ EVALUATION & CI ============ -->
  <rect x="24" y="634" width="1352" height="178" rx="18" fill="#F1ECFB" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="44" y="661" class="bnd" style="fill:#5B21B6">EVALUATION &amp; CI</text>
  <text x="256" y="661" class="ps">offline by design: no key, no network in CI</text>

  <rect x="44" y="672" width="240" height="134" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="60" y="696" class="pn">Golden set</text>
  <rect x="60" y="712" width="208" height="30" rx="15" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="76" y="733" class="ps" style="font-weight:600">dev split · open</text>
  <rect x="60" y="760" width="208" height="30" rx="15" fill="#4C1D95"/>
  <rect x="72" y="772" width="14" height="10" rx="2" fill="#FFFFFF"/><path d="M75 772 V769 A4 4 0 0 1 83 769 V772" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="96" y="781" class="chp">test split · locked</text>

  <rect x="318" y="672" width="380" height="66" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="334" y="698" class="pn">Eval runners</text><text x="334" y="721" class="ps">router, retrieval, agent</text>
  <rect x="528" y="688" width="158" height="32" rx="16" fill="#EDE4FB" stroke="#6D28D9" stroke-width="1.5"/>
  <ellipse cx="548" cy="699" rx="7" ry="3" fill="none" stroke="#5B21B6" stroke-width="1.8"/><path d="M541 699 V709 A7 3 0 0 0 555 709 V699" fill="none" stroke="#5B21B6" stroke-width="1.8"/>
  <text x="562" y="710" class="ps" style="font-weight:600">LLM cache</text>

  <rect x="318" y="748" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="334" y="773" class="pn">final_evaluation</text><text x="334" y="796" class="ps">freeze tag · state fingerprint</text>

  <rect x="732" y="672" width="260" height="134" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="748" y="698" class="pn">Results + hash</text>
  <text x="748" y="722" class="ps">deterministic_sha256</text>
  <text x="748" y="744" class="ps">committed JSON files</text>

  <rect x="1026" y="672" width="330" height="134" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="1042" y="698" class="pn">GitHub Actions</text>
  <text x="1042" y="722" class="ps">test · unit tests, offline</text>
  <text x="1042" y="744" class="ps">integrity · results recompute</text>
  <text x="1042" y="766" class="ps">secrets · gitleaks, history</text>
  <text x="1042" y="788" class="ps">actions pinned by SHA</text>

  <path d="M268 727 H318" class="off" marker-end="url(#aOff)"/>
  <path d="M268 775 H318" class="off" marker-end="url(#aOff)"/>
  <path d="M698 705 H732" class="off" marker-end="url(#aOff)"/>
