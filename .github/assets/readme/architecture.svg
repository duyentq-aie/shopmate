  <text x="754" y="849" class="sb">trace write / read</text>
  <path d="M912 843 H962" class="off" marker-end="url(#aOff)"/>
  <text x="974" y="849" class="sb">offline flow</text>
  <text x="44" y="877" class="sb">Numbers: order of the steps in one turn · orange tag: calls the LLM · blue tag: reads Qdrant or Saleor · dark pills: hard limits in code</text>
</svg>
